name: Sanitizers and fuzzing

on:
  push:
    branches: [master]
  pull_request:

jobs:
  sanitizer-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libnl-route-3-dev libcap-dev clang
      - name: Build hardened default
        run: make -j"$(nproc)"
      - name: Build ASan+UBSan
        run: make asan -j"$(nproc)"
      - name: ASan jail smoke
        run: ./nsjail-asan -Mo --chroot / --user 65534 --group 65534 -- /bin/true
      - name: Build fuzzers
        run: make fuzz-nstun fuzz-kafel -j"$(nproc)"
      - name: nstun fuzz smoke
        run: ./fuzz/nstun_fuzz fuzz/nstun_corpus -max_total_time=120 -rss_limit_mb=4096
      - name: kafel fuzz smoke
        run: ./fuzz/kafel_fuzz fuzz/kafel_corpus -max_total_time=120 -rss_limit_mb=4096
